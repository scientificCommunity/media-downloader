name: Release Extension

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build extension
        run: npm run build

      - name: Package release
        shell: bash
        run: |
          VERSION="$(node -p "require('./public/manifest.json').version")"
          TAG="v${VERSION}"
          ARCHIVE="media-downloader-${TAG}.zip"

          test -f dist/manifest.json
          (
            cd dist
            zip -r "../${ARCHIVE}" .
          )

          sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"

          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Verify package layout
        shell: bash
        run: |
          unzip -l "$ARCHIVE" | grep -q 'manifest.json'
          unzip -p "$ARCHIVE" manifest.json | grep -q '"manifest_version": 3'

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cat > release-notes.md <<EOF
          # Media Downloader ${TAG}

          Prebuilt Chrome extension package. No Node.js or npm is required for installation.

          ## Installation

          1. Download \`${ARCHIVE}\` from the Assets section below.
          2. Extract the ZIP file.
          3. Open \`chrome://extensions\` in Chrome or another Chromium-based browser.
          4. Enable **Developer mode**.
          5. Click **Load unpacked**.
          6. Select the extracted folder.
          7. Pin **Media Downloader** to the browser toolbar.

          ## Features

          - Detect media resources loaded by web pages.
          - Download regular direct video/audio files.
          - Detect DASH / MSE / HTTP Range media tracks.
          - Detect separate video/audio tracks and locally mux supported tracks into MP4.
          - Record supported unencrypted HLS live streams with stop/save and recovery support.
          - Detect Bilibili non-DRM M4S video/audio tracks.
          - English, Simplified Chinese, Traditional Chinese and Japanese UI.

          ## Important notes

          - This project is intended for media that you are authorized to access and save.
          - DRM-protected media is not supported.
          - The project does not provide paywall, authentication or other access-control bypass functionality.
          - \`${ARCHIVE}.sha256\` is provided for integrity verification.

          ---

          ## 中文说明

          这是可直接加载到 Chrome / Chromium 浏览器的预构建插件包，安装时不需要 Node.js 或 npm。

          ### 安装方法

          1. 在下方 **Assets** 中下载 \`${ARCHIVE}\`。
          2. 解压 ZIP。
          3. 打开 \`chrome://extensions\`。
          4. 开启右上角 **开发者模式**。
          5. 点击 **加载已解压的扩展程序**。
          6. 选择刚刚解压出来的文件夹。
          7. 将 **Media Downloader** 固定到浏览器工具栏即可使用。

          ### 当前能力

          - 网页媒体资源检测。
          - 普通视频 / 音频直链下载。
          - DASH / MSE / HTTP Range 媒体轨道检测。
          - 视频 / 音频分轨自动识别，并在浏览器本地合并为 MP4。
          - 支持的非加密 HLS 直播录制、停止保存和恢复。
          - Bilibili 非 DRM M4S 视频 / 音频轨道识别。
          - 英文、简体中文、繁体中文、日语界面。

          ### 重要说明

          - 本项目仅用于用户有权访问和保存的媒体内容。
          - 不支持 DRM 受保护内容。
          - 不提供付费墙、登录权限或其他访问控制绕过能力。
          - 同时提供 \`${ARCHIVE}.sha256\` 用于文件完整性校验。
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "Media Downloader ${TAG}" \
              --notes-file release-notes.md
            gh release upload "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" --clobber
          else
            gh release create "$TAG" \
              "$ARCHIVE" \
              "$ARCHIVE.sha256" \
              --target "$GITHUB_SHA" \
              --title "Media Downloader ${TAG}" \
              --notes-file release-notes.md
          fi
